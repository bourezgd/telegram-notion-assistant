name = "telegram-notion-assistant"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# كل دقيقة
[triggers]
crons = ["* * * * *"]

[vars]
# ───────── 👤 معلوماتك (عدّلها) ─────────
ABOUT_ME = ""            # جملة عنك تساعد المساعد (Gemini)، مثل: "مصمم مستقل، متزوج"
FAMILY = "أنا,الزوجة"     # الأشخاص في الملف الصحي، مفصولون بفاصلة (اسم الطفل يُضاف تلقائيًا)
CHILD_NAME = ""          # اسم طفلك لميزات يوميات الصور والنمو (فارغ = بلا هذه الميزات)
CHILD_BIRTH = ""         # تاريخ ميلاده YYYY-MM-DD
CHILD_SEX = "girl"       # girl أو boy (لصيغة الكلام ومتوسطات النمو)
CHILD_NUDGE_TIME = "18:00" # تذكير لطيف إن مرّ CHILD_NUDGE_DAYS يومًا بلا صورة جديدة للطفل
CHILD_NUDGE_DAYS = "7"
COUNTRY = "الجزائر"
DISABLE = ""             # ميزات تريد إيقافها، مثل: "prayer,money" — prayer (الصلاة والأذكار والورد ورمضان) · money (المال) · jihat (الحصص)

# ───────── 🗂️ معرّفات قواعد Notion — يملؤها: node scripts/setup-notion.mjs ─────────
DS_TASK = ""
DS_REMINDER = ""
DS_IDEA = ""
DS_HEALTH = ""
DS_TRACKER = ""
DS_FINANCE = ""
DS_BUDGET = ""
DS_JIHAT = ""
DS_EVENTS = ""
DS_DIARY = ""
DS_HABITS = ""
DS_GROWTH = ""

# ───────── ⏰ الوقت والمدينة ─────────
TZ_NAME = "Africa/Algiers"
DATE_ONLY_HOUR = "8"   # ساعة التنبيه للمهام التي ليس لها ساعة محددة
# موقع مدينتك لحساب أوقات الصلاة (هنا الجزائر العاصمة)
CITY_LAT = "36.7538"
CITY_LNG = "3.0588"
# تعديل بالدقائق لكل صلاة (فجر، ظهر، عصر، مغرب، عشاء) لمطابقة رزنامة المسجد
PRAYER_OFFSETS = "0,2,0,3,0"
PRAYER_REMIND_MIN = "30" # تذكير ثانٍ إن لم تُسجَّل الصلاة بعد كذا دقيقة
REVIEW_HOUR = "21"       # ساعة مراجعة المساء
WEEKLY_DAY = "4"         # يوم التقرير الأسبوعي (0 الأحد … 4 الخميس … 6 السبت)
WEEKLY_TIME = "21:30"
EVENTS_TIME = "09:00"    # ساعة تذكير المناسبات العائلية
HEALTH_LEAD_MIN = "120"  # تنبيه الموعد الطبي قبله بكذا دقيقة
HEALTH_EVE_HOUR = "20"   # تذكير مساء اليوم السابق للموعد الطبي
WEEKEND_DAYS = "5,6"     # العطلة (0 الأحد … 5 الجمعة، 6 السبت): مهام الجهات غير المعلّمة «العمل في العطلة» تُرحَّل
MORNING_TIME = "07:30"   # الملخص الصباحي
ADHKAR_AFTER_MIN = "40"  # أذكار الصباح/المساء بعد أذان الفجر/العصر بكذا دقيقة
KAHF_AFTER_MIN = "60"    # الجمعة: تذكير سورة الكهف بعد صلاة الجمعة بكذا دقيقة
WIRD_TIME = "20:30"      # تذكير الورد القرآني
SUHOOR_LEAD_MIN = "45"   # رمضان: تذكير السحور قبل الفجر بكذا دقيقة
TARAWEEH_AFTER_MIN = "45" # رمضان: تذكير التراويح بعد أذان العشاء
HIJRI_OFFSET = "0"       # إزاحة التقويم الهجري (أم القرى) بالأيام؛ بداية رمضان وشوال تُؤكَّد بسؤال الرؤية
QUOTA_TIME = "10:00"     # تنبيه الحصة الشهرية (يوم 1 و15 وقبل نهاية الشهر بـ 5 أيام)

# يُستبدل المعرّف تلقائيًا في deploy.yml
[[kv_namespaces]]
binding = "STATE"
id = "__KV_ID__"
